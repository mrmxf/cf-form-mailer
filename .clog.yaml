# =============================================================================
#  The form engine. No build, no deploy: consumers pin a git tag.
#
#    clog test        the test suite - the only gate
#
#                        ⇓⇓⇓⇓⇓⇓⇓           ⇓⇓⇓⇓
# ALL YAML KEYS ARE ⇒⇒ lowercase ⇔ with hyphens ⇐⇐ (not underscores) only.
#                        ⇑⇑⇑⇑⇑⇑⇑           ⇑⇑⇑⇑
# -----------------------------------------------------------------------------
# `kfg` is the current config key, `clog` the legacy one. Both are set so this
# repo works with clog v0.11.x and the older v0.10.x binaries.
kfg:
  releases-path: "releases.yaml"
clog:
  releases-path: "releases.yaml"

snippets:
  test: node --test "src/*.test.js"
